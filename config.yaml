# Proxmox VM Monitor Configuration
# Customize these settings for your environment

proxmox:
  host: "10.10.10.3"
  user: "root@pam"
  password: "${PROXMOX_PASSWORD}"  # Set via environment variable for security
  verify_ssl: false

cip:
  pulse_signal: 1  # CIP signal index to subscribe to for responses
  pulse_timeout: 3  # seconds to wait for CIP response

monitor:
  interval: 10  # seconds between health checks
  failure_threshold: 3  # consecutive failures before migration
  migration_timeout: 60  # seconds to wait for migration to complete
  
  # Each VM has its own CIP connection with unique host and IP_ID
  vms:
    "100":  # Proxmox container ID
      cip_host: "10.10.10.10"  # Crestron VC4 device IP
      cip_ip_id: 0x13          # Crestron IP ID for this VM's connection
    "101":
      cip_host: "10.10.10.11"  # Different Crestron device
      cip_ip_id: 0x14          # Different IP ID

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "proxmox_monitor.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
